# Evaluation task. Internal: only the [issue], [environment], [[commands]],
# [budgets] and repository fields are ever shown to an agent.
schema_version = 1
task_id = "inj-002-exprcalc"
kind = "injected"

[repository]
kind = "fixture"
path = "repo"
tree_sha256 = "784d21d8f6013dc217d8809bead4ceed26ed3ec6a43babc2cd430d26972ce828"

[issue]
title = "Wrong result for expressions with several subtractions or divisions"
body = """
evaluate() returns wrong numbers for some simple expressions in our invoice
calculator. A single subtraction or division is fine, and addition and
multiplication chains are fine, but as soon as an expression has two
subtractions in a row the result is off. Division shows the same problem.

Adding parentheses around the left part works around it, for example
"(10 - 4) - 3" gives 3, so the operators themselves seem to work.
"""
expected_behavior = """
Operators of the same precedence are applied from left to right, as in
ordinary arithmetic: "10 - 4 - 3" is 3 and "100 / 10 / 5" is 2.
"""
actual_behavior = """
evaluate("10 - 4 - 3") returns 9.0 and evaluate("100 / 10 / 5") returns 50.0.
"""
reproduction = """
from exprcalc import evaluate
evaluate("10 - 4 - 3")     # 9.0, expected 3.0
evaluate("100 / 10 / 5")   # 50.0, expected 2.0
"""

[environment]
source_roots = ["src"]

[[commands]]
name = "tests"
targets = ["tests"]

[budgets]
timeout_seconds = 60
memory_mb = 512
cpus = 1.0
pids = 128

[evaluation]
