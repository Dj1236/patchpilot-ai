[project]
name = "patchpilot-ai"
version = "0.1.0"
description = "Autonomous software maintenance agent that turns a Python bug report into a tested, reviewable patch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "typer>=0.29.1",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Evaluation fixtures are separate, digest-pinned projects: reformatting them
# would change their pins.
extend-exclude = ["evals"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # security (bandit rules)
    "SIM", # simplifications
    "C4",  # comprehensions
    "PTH", # pathlib over os.path
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# In tests: assert is the point; probe sources and planted canaries look like
# secrets and temporary paths to the security rules but are neither.
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
xfail_strict = true
markers = [
    "sandbox: needs a running Docker engine; skipped when none is reachable",
    "network: makes real read-only requests to GitHub; runs only when PATCHPILOT_LIVE_GITHUB=1",
]

[tool.coverage.run]
source = ["patchpilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
